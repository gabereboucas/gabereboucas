<svg width="1200" height="330" viewBox="0 0 1200 330" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="330">
      <stop stop-color="#070709"/>
      <stop offset="1" stop-color="#0B0B0F"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(1010 55) rotate(145) scale(430 310)">
      <stop stop-color="#8B5CF6" stop-opacity=".22"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="78" y1="247" x2="675" y2="247">
      <stop stop-color="#8B5CF6"/>
      <stop offset=".55" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#67E8F9"/>
    </linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" stroke="#fff" stroke-opacity=".025"/>
    </pattern>
  </defs>

  <rect x="1" y="1" width="1198" height="328" rx="24" fill="url(#bg)" stroke="#fff" stroke-opacity=".09"/>
  <rect x="1" y="1" width="1198" height="328" rx="24" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="328" rx="24" fill="url(#glow)"/>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="78" y="62" fill="#9CA3AF" font-size="14" font-weight="600" letter-spacing="3.2">GABRIEL REBOUÇAS / ENGINEER + BUILDER</text>

    <text x="78" y="142" fill="#F4F4F5" font-size="52" font-weight="760" letter-spacing="-2">
      PRODUCT × AUTOMATION
    </text>
    <text x="78" y="198" fill="#F4F4F5" font-size="52" font-weight="760" letter-spacing="-2">
      × UX × 3D
    </text>

    <rect x="78" y="238" width="600" height="2" rx="1" fill="#242429"/>
    <rect x="78" y="238" width="145" height="2" rx="1" fill="url(#line)">
      <animate attributeName="width" values="145;600;145" dur="7.5s" repeatCount="indefinite"/>
    </rect>

    <text x="78" y="278" fill="#B9BBC4" font-size="17" font-weight="500">Digital products · Cloud systems · Creative technology · Prototyping</text>
  </g>

  <g transform="translate(900 100)">
    <rect width="222" height="126" rx="20" fill="#fff" fill-opacity=".035" stroke="#fff" stroke-opacity=".1"/>
    <circle cx="28" cy="29" r="5" fill="#34D399">
      <animate attributeName="opacity" values=".35;1;.35" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <text x="44" y="34" fill="#AEB1BA" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">CURRENTLY BUILDING</text>
    <text x="26" y="76" fill="#F4F4F5" font-size="20" font-weight="700" font-family="Inter, ui-sans-serif, system-ui">Agência 808</text>
    <text x="26" y="101" fill="#9CA3AF" font-size="14" font-family="Inter, ui-sans-serif, system-ui">products · systems · 3D</text>
  </g>
</svg>
