<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07070A"/>
      <stop offset="1" stop-color="#0D0B14"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(918 68) rotate(136) scale(560 390)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7C3AED" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="126" y1="302" x2="709" y2="302" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7C3AED"/>
      <stop offset="0.5" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#FFFFFF" stroke-opacity="0.035"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect x="1" y="1" width="1198" height="418" rx="28" fill="url(#bg)" stroke="#FFFFFF" stroke-opacity="0.10"/>
  <rect x="1" y="1" width="1198" height="418" rx="28" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="418" rx="28" fill="url(#glow)"/>

  <circle cx="1012" cy="92" r="122" fill="#7C3AED" fill-opacity="0.10" filter="url(#soft)">
    <animate attributeName="r" values="100;140;100" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="fill-opacity" values="0.08;0.18;0.08" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1055" cy="300" r="98" fill="#22D3EE" fill-opacity="0.06" filter="url(#soft)">
    <animate attributeName="cy" values="292;314;292" dur="10s" repeatCount="indefinite"/>
  </circle>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="78" y="72" fill="#A1A1AA" font-size="16" font-weight="600" letter-spacing="4">GABRIEL REBOUÇAS / 2026</text>
    <text x="78" y="164" fill="#F4F4F5" font-size="62" font-weight="760" letter-spacing="-2.5">ENGINEERING × DATA</text>
    <text x="78" y="228" fill="#F4F4F5" font-size="62" font-weight="760" letter-spacing="-2.5">× PRODUCT</text>

    <rect x="78" y="278" width="650" height="2" rx="1" fill="#27272A"/>
    <rect x="78" y="278" width="160" height="2" rx="1" fill="url(#accent)">
      <animate attributeName="width" values="120;650;120" dur="7s" repeatCount="indefinite"/>
    </rect>

    <text x="78" y="326" fill="#C4C4CC" font-size="20" font-weight="500">Control &amp; Automation Engineer · Project Development Analyst</text>
    <text x="78" y="360" fill="#8B8B96" font-size="17">Cloud systems · Geospatial data · Remote sensing · UX · Prototyping</text>
  </g>

  <g transform="translate(904 185)">
    <rect x="0" y="0" width="214" height="128" rx="22" fill="#FFFFFF" fill-opacity="0.035" stroke="#FFFFFF" stroke-opacity="0.11"/>
    <circle cx="28" cy="29" r="5" fill="#34D399">
      <animate attributeName="opacity" values="0.45;1;0.45" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <text x="44" y="35" fill="#B8BAC2" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">CURRENT FOCUS</text>
    <text x="25" y="76" fill="#F4F4F5" font-size="19" font-weight="700" font-family="Inter, ui-sans-serif, system-ui">Water + Remote</text>
    <text x="25" y="101" fill="#F4F4F5" font-size="19" font-weight="700" font-family="Inter, ui-sans-serif, system-ui">Sensing + ML</text>
  </g>
</svg>
